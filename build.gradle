def aqlGrammar = file('src/main/java/edu/common/dynamicextensions/query/AQL.g4')
def aqlOutputDir = file('src/main/java/edu/common/dynamicextensions/query/antlr')

tasks.register('generateAqlParser', JavaExec) {
  description = 'Generates ANTLR parser/lexer sources for AQL.g4'
  group = 'build'

  classpath = configurations.antlrTool
  mainClass = 'org.antlr.v4.Tool'

  inputs.file(aqlGrammar)
  outputs.dir(aqlOutputDir)

  args '-visitor',
       '-package', 'edu.common.dynamicextensions.query.antlr',
       '-o', aqlOutputDir.absolutePath,
       aqlGrammar.absolutePath
}

